<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080418" />
  <title>Contact — Stackly Illustration Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="scroll-progress"></div>
  <div id="bg" aria-hidden="true"><div id="stars"></div><div id="particles"></div></div>

  <header id="navbar">
    <nav class="nav container">
      <a href="index.html" class="nav-logo" aria-label="Stackly home"><img src="images/Stackly_logo.png" alt="Stackly logo" /></a>
      <ul class="nav-menu" id="nav-menu">
        <li><a class="nav-link" href="index.html" data-page="index.html">Home</a></li>
        <li><a class="nav-link" href="about.html" data-page="about.html">About</a></li>
        <li><a class="nav-link" href="services.html" data-page="services.html">Services</a></li>
        <li><a class="nav-link" href="portfolio.html" data-page="portfolio.html">Portfolio</a></li>
        <li><a class="nav-link active" href="contact.html" data-page="contact.html">Contact</a></li>
        <li><a class="btn btn-grad btn-sm nav-cta" href="signin.html" data-magnetic>Sign In</a></li>
      </ul>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </nav>
  </header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="sec-tag reveal" data-reveal>Contact</span>
        <h1 class="sec-title reveal" data-reveal data-delay="100">Let's build something <span class="grad-text">amazing</span></h1>
        <p class="sec-sub reveal" data-reveal data-delay="200">Tell us about your idea and our studio will get back to you within 24 hours.</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div class="contact-map glass reveal" data-reveal>
          <div class="map-heading"><span class="sec-tag">Find us</span><h3>Creativity District</h3><p>Brooklyn, New York</p></div>
          <iframe title="Stackly location map" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=-74.025%2C40.685%2C-73.965%2C40.725&amp;layer=mapnik&amp;marker=40.705%2C-73.995"></iframe>
          <a class="map-link" href="https://www.openstreetmap.org/?mlat=40.705&amp;mlon=-73.995#map=14/40.705/-73.995" target="_blank" rel="noopener">Open larger map&nbsp;↗</a>
        </div>

        <form class="contact-form glass reveal" data-reveal data-delay="150" id="contact-form" novalidate>
          <div class="form-row">
            <div class="form-field"><label for="f-name">Name</label><input type="text" id="f-name" name="name" placeholder="Jane Cooper" autocomplete="name" required /></div>
            <div class="form-field"><label for="f-email">Email</label><input type="email" id="f-email" name="email" placeholder="jane@company.com" autocomplete="email" required /></div>
          </div>
          <div class="form-row">
            <div class="form-field"><label for="f-company">Company</label><input type="text" id="f-company" name="company" placeholder="Your company" autocomplete="organization" /></div>
            <div class="form-field"><label for="f-type">Project Type</label><select id="f-type" name="type" required><option value="">Select a type</option><option>Custom Illustration</option><option>Character / Mascot Design</option><option>Book Illustration</option><option>Branding &amp; Packaging</option><option>Motion Graphics</option><option>3D Illustration</option></select></div>
          </div>
          <div class="form-row">
            <div class="form-field"><label for="f-budget">Budget</label><select id="f-budget" name="budget"><option value="">Select a range</option><option>&lt; $2,000</option><option>$2,000 – $5,000</option><option>$5,000 – $15,000</option><option>$15,000+</option></select></div>
            <div class="form-field"><label for="f-timeline">Timeline</label><select id="f-timeline" name="timeline"><option value="">Select a timeline</option><option>ASAP</option><option>1 – 2 weeks</option><option>1 – 2 months</option><option>Flexible</option></select></div>
          </div>
          <div class="form-field"><label for="f-message">Message</label><textarea id="f-message" name="message" rows="5" placeholder="Tell us about your project..." required></textarea></div>
          <button type="submit" class="btn btn-grad btn-lg btn-block" data-magnetic id="submit-btn"><span class="btn-label">Send Message</span><span class="btn-load" aria-hidden="true"></span></button>
          <p class="form-note" id="form-note" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="footer"><div class="container footer-bottom"><span>© <span id="year"></span> Stackly Studio</span><a href="index.html">Back to home</a></div></footer>
  <button id="back-to-top" class="back-to-top" aria-label="Back to top">↑</button>
  <script src="js/links.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
